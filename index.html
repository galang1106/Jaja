<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laxerouse Community</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-[#121621] text-white min-h-screen font-sans pb-10">

  <!-- Header -->
  <header class="bg-[#181f2e] p-4 sticky top-0 z-50 border-b border-gray-800 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-users-gear text-red-500 text-xl"></i>
        <h1 class="text-lg font-bold tracking-wide">Laxerouse Community</h1>
      </div>
      <span id="member-count" class="bg-red-500/10 text-red-400 text-xs px-3 py-1 rounded-full font-semibold border border-red-500/20">
        Memuat...
      </span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- Info Card -->
    <div class="bg-[#181f2e] p-4 rounded-2xl border border-gray-800 shadow-sm flex items-center space-x-4">
      <div class="w-14 h-14 bg-red-500/10 rounded-2xl border border-red-500/20 flex items-center justify-center shrink-0">
        <i class="fa-solid fa-shield-halved text-2xl text-red-500"></i>
      </div>
      <div class="overflow-hidden">
        <h2 id="group-name" class="font-bold text-lg truncate">LAXEROUSE</h2>
        <p class="text-xs text-gray-400">ID: 758074897</p>
      </div>
    </div>

    <!-- Search Input -->
    <div class="relative">
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
      <input 
        type="text" 
        id="search-input" 
        placeholder="Cari member..." 
        class="w-full bg-[#181f2e] border border-gray-800 rounded-xl pl-10 pr-4 py-3 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-red-500 transition"
        oninput="filterMembers()"
      />
    </div>

    <div class="flex items-center justify-between pt-2">
      <h3 class="text-sm font-semibold text-gray-300">Daftar Anggota</h3>
      <span class="text-xs text-gray-500">Terbaru</span>
    </div>

    <!-- List Members -->
    <div id="members-list" class="space-y-2.5">
      <div class="text-center py-8 text-gray-500 text-sm">
        <i class="fa-solid fa-circle-notch animate-spin text-2xl text-red-500 mb-2"></i>
        <p>Membaca data Roblox...</p>
      </div>
    </div>

  </main>

  <script>
    let allMembers = [];

    async function loadData() {
      try {
        const res = await fetch('/api/roblox');
        const data = await res.json();

        if (data.error) throw new Error(data.error);

        document.getElementById('group-name').innerText = data.name;
        document.getElementById('member-count').innerText = `${data.memberCount} Member`;

        allMembers = data.members || [];
        renderMembers(allMembers);

      } catch (err) {
        console.error(err);
        document.getElementById('members-list').innerHTML = `
          <div class="bg-red-500/10 border border-red-500/20 rounded-xl p-4 text-center text-red-400 text-xs">
            Gagal memuat data member.
          </div>`;
      }
    }

    function renderMembers(members) {
      const container = document.getElementById('members-list');
      if (!members || members.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-500 text-xs py-4">Tidak ada data member.</p>`;
        return;
      }

      container.innerHTML = members.map(m => `
        <div class="bg-[#181f2e] border border-gray-800 p-3.5 rounded-xl flex items-center justify-between shadow-sm">
          <div class="flex items-center space-x-3 overflow-hidden">
            <div class="w-10 h-10 rounded-full bg-red-500/10 border border-red-500/20 shrink-0 flex items-center justify-center font-bold text-red-400 text-sm">
              ${m.username.charAt(0).toUpperCase()}
            </div>
            <div class="overflow-hidden">
              <p class="font-bold text-sm text-gray-100 truncate">${m.displayName}</p>
              <p class="text-xs text-gray-400 truncate">@${m.username}</p>
            </div>
          </div>
          <div class="text-right shrink-0 pl-2">
            <span class="block text-[10px] text-gray-400 font-medium uppercase tracking-wider">Status / Waktu</span>
            <span class="text-xs font-semibold text-red-400">${m.joinTime}</span>
          </div>
        </div>
      `).join('');
    }

    function filterMembers() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = allMembers.filter(m => 
        m.username.toLowerCase().includes(query) || 
        m.displayName.toLowerCase().includes(query)
      );
      renderMembers(filtered);
    }

    loadData();
  </script>
</body>
</html>
